<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神话艺术图鉴 | MYTHOS ART NOUVEAU</title>
    <link rel="icon" href="img/favicon.png" type="image/png">
    
    <!-- 样式库 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 工具库：截图与二维码 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --c-spades: #1e3a8a;
            --c-hearts: #0d9488;
            --c-clubs: #3f6212;
            --c-diamonds: #b45309;
        }

        body {
            background-color: #050505;
            font-family: 'Playfair Display', serif;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        .font-art { font-family: 'Cinzel Decorative', cursive; }

        .bg-texture {
            position: fixed; inset: 0; z-index: -1;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23ffffff' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
        }

        /* 基础卡牌样式 */
        .card-wrapper { perspective: 1500px; }
        .game-card {
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
            will-change: transform;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8);
        }
        .game-card:hover {
            box-shadow: 0 0 30px -5px var(--main);
            border-color: var(--main);
        }

        .theme-spades { --main: var(--c-spades); }
        .theme-hearts { --main: var(--c-hearts); }
        .theme-clubs { --main: var(--c-clubs); }
        .theme-diamonds { --main: var(--c-diamonds); }

        .z-level-img { transform: translateZ(10px); }
        .z-level-text { transform: translateZ(30px); }

        /* --- 模态框与3D旋转相关样式 --- */
        #modal-overlay {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #modal-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        
        .modal-perspective {
            perspective: 2000px;
        }

        /* 3D 旋转容器 */
        .rotate-card-container {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: spin-slow 8s infinite linear;
        }
        
        .rotate-card-container.paused,
        .rotate-card-container:hover {
            animation-play-state: paused;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .card-face.front {
            background: #111;
            transform: rotateY(0deg);
        }

        .card-face.back {
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
            transform: rotateY(180deg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes spin-slow {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }
        
        @keyframes spin-disk {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .back-pattern {
            background-image: radial-gradient(rgba(255,215,0,0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            position: absolute; inset: 0; opacity: 0.3;
        }
        
        .stop-propagation {
            cursor: default;
        }

        .music-playing .music-ring {
            animation: spin-disk 3s infinite linear;
            opacity: 1;
        }

        /* --- 弹窗样式修正 --- */
        #share-result-overlay {
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(8px);
        }
        
        /* 增加顶部内边距，防止视觉上太贴顶 */
        #share-result-overlay .result-modal {
            max-height: 90vh;
            margin-top: 2vh;
        }

        /* 隐藏的生成模板容器 
           关键点：使用 z-index: -100 放在底层，而不是 display: none
           物理尺寸设置得很大，保证清晰度
        */
        #share-template-container {
            position: fixed;
            left: 0;
            top: 0;
            z-index: -100;
            width: 800px;
            height: 1400px;
            /* 避免干扰鼠标交互 */
            pointer-events: none;
            /* 透明度0可以隐藏，但html2canvas仍能捕捉 */
            opacity: 0; 
        }

        #share-card-render {
            width: 800px;
            height: 1400px;
            background-color: #050505;
            position: relative;
            /* 启用字体平滑 */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div class="bg-texture"></div>
    
    <!-- BGM -->
    <audio id="bgm" loop>
        <source src="veil.mp3" type="audio/mpeg">
    </audio>

    <!-- 音乐控制 -->
    <div class="fixed bottom-6 right-6 z-40">
        <button id="music-btn" onclick="toggleMusic()" class="relative w-12 h-12 rounded-full bg-black/80 border border-amber-500/30 text-amber-500/80 backdrop-blur-md flex items-center justify-center hover:bg-amber-900/40 hover:text-amber-200 hover:border-amber-400/50 transition-all hover:scale-110 active:scale-95 group">
            <i id="music-icon" class="fa-solid fa-play text-sm relative z-10 transition-all"></i>
            <div id="music-ring" class="music-ring absolute inset-1 rounded-full border border-dashed border-amber-500/40 opacity-0 transition-opacity duration-500 pointer-events-none"></div>
            <span class="absolute right-full mr-3 bg-black/80 text-amber-500/80 text-[10px] px-2 py-1 rounded tracking-widest uppercase opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">
                Original Soundtrack
            </span>
        </button>
    </div>

    <header class="py-12 text-center relative z-10 bg-gradient-to-b from-black/90 to-transparent">
        <h1 class="text-4xl md:text-6xl font-art font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-yellow-100 to-amber-200 drop-shadow-sm mb-2">
            MYTHOS & ART
        </h1>
        <p class="text-amber-500/60 tracking-[0.3em] text-xs uppercase font-semibold">The Art Nouveau Collection</p>
    </header>

    <nav class="flex justify-center gap-2 md:gap-6 mb-10 px-4 flex-wrap z-20 relative">
        <button onclick="filter('all')" class="px-5 py-2 bg-white/5 hover:bg-white/10 border border-white/10 rounded-full text-xs tracking-widest transition-all active:scale-95">ALL</button>
        <button onclick="filter('spades')" class="px-5 py-2 bg-blue-950/40 hover:bg-blue-900/60 border border-blue-500/20 text-blue-200 rounded-full text-xs tracking-widest transition-all"><i class="fa-solid fa-crow mr-2"></i>SKY</button>
        <button onclick="filter('hearts')" class="px-5 py-2 bg-teal-950/40 hover:bg-teal-900/60 border border-teal-500/20 text-teal-200 rounded-full text-xs tracking-widest transition-all"><i class="fa-solid fa-water mr-2"></i>ABYSS</button>
        <button onclick="filter('clubs')" class="px-5 py-2 bg-green-950/40 hover:bg-green-900/60 border border-green-500/20 text-green-200 rounded-full text-xs tracking-widest transition-all"><i class="fa-solid fa-tree mr-2"></i>FOREST</button>
        <button onclick="filter('diamonds')" class="px-5 py-2 bg-orange-950/40 hover:bg-orange-900/60 border border-orange-500/20 text-orange-200 rounded-full text-xs tracking-widest transition-all"><i class="fa-solid fa-mountain mr-2"></i>MOUNTAIN</button>
    </nav>

    <main class="container mx-auto px-4 pb-24">
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10 justify-items-center">
            <!-- Cards injected by JS -->
        </div>
    </main>

    <!-- 卡牌详情 3D 模态框 -->
    <div id="modal-overlay" class="fixed inset-0 z-50 flex items-center justify-center hidden" onclick="closeModal()">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-md"></div>
        
        <div class="relative z-10 w-[360px] h-[504px] modal-perspective stop-propagation" onclick="event.stopPropagation()">
            <div id="rotate-container" class="rotate-card-container group">
                <div class="card-face front">
                    <div id="modal-content" class="w-full h-full relative flex flex-col text-gray-200">
                        <!-- JS 填充 -->
                    </div>
                </div>
                
                <div class="card-face back border-2 border-amber-500/20">
                    <div class="back-pattern"></div>
                    <div class="relative z-10 text-center p-8 border border-amber-500/30 m-4 h-[94%] flex flex-col justify-center items-center bg-black/40">
                        <i class="fa-solid fa-dragon text-6xl text-amber-700/50 mb-6"></i>
                        <h2 class="text-4xl font-art font-bold text-transparent bg-clip-text bg-gradient-to-b from-amber-200 to-amber-800 mb-2">MYTHOS</h2>
                        <div class="w-16 h-[1px] bg-amber-500/50 my-4"></div>
                        <p class="text-[10px] tracking-[0.4em] text-amber-500/60 uppercase">Collector's Edition</p>
                    </div>
                </div>
            </div>
            
            <div class="absolute -bottom-20 left-0 right-0 text-center flex flex-col gap-2 items-center justify-center">
                <span class="text-white/40 text-sm tracking-widest animate-pulse">CLICK OUTSIDE TO CLOSE</span>
            </div>
        </div>
    </div>

    <!-- 
      === 核心修复：高清 HTML 模板 === 
      我们使用一个物理尺寸巨大的 div (800x1400) 作为模板。
      利用 HTML/CSS 的布局能力来替代难用的 Canvas API。
      内嵌式设计：图片放在 padding 内部。
    -->
    <div id="share-template-container">
        <div id="share-card-render" class="flex flex-col">
            <!-- 1. 背景纹理 -->
            <div class="absolute inset-0 bg-[#050505]">
                <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(#222 1px, transparent 1px); background-size: 20px 20px;"></div>
                <div class="absolute inset-0 bg-gradient-to-b from-[#111] via-transparent to-[#050505] opacity-80"></div>
            </div>

            <!-- 2. 金色边框 (绝对定位，确保在图片上方形成框，或者图片在框内) -->
            <!-- 这里使用 padding 策略：外层容器 padding=20px，背景图在内容区 -->
            <div class="absolute inset-0 border-4 border-amber-700 z-20 pointer-events-none m-5"></div>
            <div class="absolute inset-0 border border-amber-400/30 z-20 pointer-events-none m-8"></div>

            <div class="relative mt-5 mx-5 h-[950px] bg-[#050505] overflow-hidden z-10">
                <div id="share-img-bg" class="w-full h-full bg-cover bg-top bg-no-repeat transition-all"></div>
                
                <div class="absolute inset-x-0 bottom-0 h-40 bg-gradient-to-t from-[#050505]/50 to-transparent pointer-events-none"></div>
            </div>

            <div class="relative z-10 flex-1 px-16 pt-8 pb-12 flex flex-col items-center text-center -mt-2">
                
                <h2 id="share-name" class="font-art text-7xl font-bold text-amber-400 drop-shadow-lg mb-4 tracking-wide">ZEUS</h2>
                
                <div class="w-20 h-1 bg-amber-700 mb-5"></div>
                
                <p id="share-title" class="font-serif text-2xl text-amber-500/70 tracking-[0.3em] uppercase mb-10">KING OF GODS</p>
                
                <div class="flex-1 w-full max-w-xl">
                     <p id="share-desc" class="font-serif text-2xl text-gray-300 italic leading-relaxed opacity-90">
                        Majestically seated on Olympus...
                    </p>
                </div>

                <div class="w-full mt-auto pt-10 flex items-end justify-between border-t border-amber-900/30">
                    <div class="text-left">
                        <h3 class="font-art text-4xl text-amber-700 font-bold tracking-widest">MYTHOS</h3>
                        <p class="font-serif text-sm text-gray-500 tracking-[0.2em] mt-2 uppercase">Art Nouveau Collection</p>
                    </div>
                    
                    <div class="bg-white p-2 border border-amber-700/50 shadow-xl">
                        <div id="qrcode-target"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 分享结果展示弹窗 -->
    <div id="share-result-overlay" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="result-modal bg-[#111] border border-amber-500/30 p-4 rounded-lg w-full max-w-[400px] shadow-2xl relative animate-[fadeIn_0.3s_ease] flex flex-col">
            
            <button onclick="closeShareResult()" class="absolute -top-4 -right-4 w-9 h-9 bg-amber-900 text-amber-100 rounded-full flex items-center justify-center hover:bg-amber-700 transition-colors z-50 shadow-lg border border-white/20">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="text-center mb-3 mt-1 flex-shrink-0">
                <h3 class="text-amber-200 font-serif tracking-widest text-sm uppercase">Collector Card</h3>
            </div>

            <!-- 预览图容器 -->
            <div id="generated-image-container" class="w-full rounded overflow-hidden border border-white/10 flex-1 min-h-0 flex items-center justify-center bg-black/50">
                <!-- 最终图片 -->
            </div>

            <div class="mt-4 flex gap-3 flex-shrink-0">
                <a id="download-link" href="#" download="mythos_card.png" class="flex-1 bg-gradient-to-r from-amber-700 to-amber-600 hover:from-amber-600 hover:to-amber-500 text-white text-center py-3 rounded text-sm tracking-widest transition-all uppercase font-bold flex items-center justify-center gap-2 shadow-lg">
                    <i class="fa-solid fa-download"></i> Save Image
                </a>
            </div>
            
            <div class="flex-shrink-0 pt-2 text-center">
                 <p class="text-[10px] text-gray-500">
                    High Resolution: 1600 x 2800
                </p>
            </div>
        </div>
    </div>

    <script>
        const getImg = (filename) => `img/${filename}`;

        const audio = document.getElementById('bgm');
        const musicBtn = document.getElementById('music-btn');
        const musicIcon = document.getElementById('music-icon');
        const musicRing = document.getElementById('music-ring');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                updateMusicUI(false);
            } else {
                audio.play().then(() => updateMusicUI(true)).catch(err => alert("Interaction required first."));
            }
        }

        function updateMusicUI(playing) {
            isPlaying = playing;
            if (playing) {
                musicIcon.classList.replace('fa-play', 'fa-pause');
                musicBtn.classList.add('music-playing');
                musicRing.classList.remove('opacity-0');
                musicRing.classList.add('opacity-100');
            } else {
                musicIcon.classList.replace('fa-pause', 'fa-play');
                musicBtn.classList.remove('music-playing');
                musicRing.classList.remove('opacity-100');
                musicRing.classList.add('opacity-0');
            }
        }

        window.addEventListener('load', () => {
            setTimeout(() => { if (!isPlaying) audio.play().then(() => updateMusicUI(true)).catch(e=>{}); }, 3000);
        });

        // --- 数据 ---
        const cards = [
            { file: "SpadesK.png", suit: "spades", rank: "K", name: "ZEUS", title: "King of Gods", style: "Gustav Klimt", desc: "Majestically seated on Olympus. Robes like Klimt's tapestry, filled with cosmic nebula. Holding pure gold foil textured lightning.", tags: ["Klimt", "Gold", "Lightning"] },
            { file: "SpadesQ.png", suit: "spades", rank: "Q", name: "HERA", title: "Queen of Gods", style: "Art Nouveau", desc: "Noble and solemn, flanked by sacred peacocks with tails of golden spirals. Dress adorned with stars and pomegranates.", tags: ["Divine", "Peacock", "Stars"] },
            { file: "SpadesJ.png", suit: "spades", rank: "J", name: "ASTRAEUS", title: "God of Dusk", style: "Vienna Secession", desc: "Winged profile holding a geometric astrolabe. Scattering seeds of light into the deep indigo night sky.", tags: ["Stars", "Dusk", "Geometry"] },
            { file: "SpadesA.png", suit: "spades", rank: "A", name: "CELESTIAL", title: "The Source", style: "Cosmic Mosaic", desc: "A collage of symbols. Golden spirals and silver squares radiating light and lightning, a cosmic relic.", tags: ["Mosaic", "Spiral", "Sky"] },
            { file: "HeartsK.png", suit: "hearts", rank: "K", name: "POSEIDON", title: "God of the Sea", style: "Tiffany Glass", desc: "Holding iridescent trident, on living coral throne. Beard flows like waves, surrounded by glass-textured fish.", tags: ["Iridescent", "Sea", "Coral"] },
            { file: "HeartsQ.png", suit: "hearts", rank: "Q", name: "AMPHITRITE", title: "Queen of Sea", style: "René Lalique", desc: "Rising elegantly from foam, translucent opalescent glow. Hair intertwined with seaweed and pearls.", tags: ["Translucent", "Pearls", "Waves"] },
            { file: "HeartsJ.png", suit: "hearts", rank: "J", name: "TRITON", title: "Sea Messenger", style: "Fluid Motion", desc: "Strong merman blowing a spiral conch. Sound becomes 'whiplash' curves creating ripples.", tags: ["Conch", "Ripple", "Muscle"] },
            { file: "HeartsA.png", suit: "hearts", rank: "A", name: "ABYSSAL", title: "Deep Core", style: "Tiffany Iridescent", desc: "Giant heart symbol, Tiffany glass texture, shifting internal colors. Surrounded by wave curves and light bubbles.", tags: ["Glass", "Bubbles", "Flow"] },
            { file: "ClubsK.png", suit: "clubs", rank: "K", name: "PAN", title: "God of Wild", style: "Nancy School", desc: "Perched on mossy ancient wood, playing pipes. Background of dense forest with rich bark textures.", tags: ["Wild", "Moss", "Nature"] },
            { file: "ClubsQ.png", suit: "clubs", rank: "Q", name: "ARTEMIS", title: "Goddess of Hunt", style: "Cameo Glass", desc: "Striding through woods with bow, crescent moon on brow. Style resembles Émile Gallé's layered glass art.", tags: ["Hunt", "Deer", "Glass"] },
            { file: "ClubsJ.png", suit: "clubs", rank: "J", name: "CERNUNNOS", title: "Horned God", style: "Celtic Nature", desc: "Cross-legged horned god with metal torque. Snake and stag attend him, deep forest mystery.", tags: ["Celtic", "Horned", "Ancient"] },
            { file: "ClubsA.png", suit: "clubs", rank: "A", name: "SYLVAN", title: "Forest Soul", style: "Marquetry", desc: "Club symbol growing from ancient trunk. Mimics wood marquetry art, full of fine vein and vine details.", tags: ["Wood", "Roots", "Life"] },
            { file: "DiamondsK.png", suit: "diamonds", rank: "K", name: "HEPHAESTUS", title: "God of Forge", style: "Gaudí Organic", desc: "Strong smith at volcano anvil. Background of Gaudí-esque organic stone columns, hammer sparking gold.", tags: ["Forge", "Fire", "Stone"] },
            { file: "DiamondsQ.png", suit: "diamonds", rank: "Q", name: "GAIA", title: "Mother Earth", style: "Beardsley Line", desc: "Magnificent reclining female, body as landscape. Beardsley-style high contrast black lines.", tags: ["Earth", "Lines", "Contrast"] },
            { file: "DiamondsJ.png", suit: "diamonds", rank: "J", name: "OUREA", title: "Mountain God", style: "Trencadís Mosaic", desc: "Rugged giant emerging from cliffs. Surface features Gaudí-style broken tile mosaic textures.", tags: ["Rock", "Mosaic", "Giant"] },
            { file: "DiamondsA.png", suit: "diamonds", rank: "A", name: "MOUNTAIN", title: "Crystal Core", style: "Geo Structure", desc: "Giant crystal symbol, sharp Beardsley lines. Embedded in flowing Gaudí-style rock strata.", tags: ["Crystal", "Gold", "Sharp"] }
        ];

        const grid = document.getElementById('grid');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalContent = document.getElementById('modal-content');
        const rotateContainer = document.getElementById('rotate-container');

        let currentCardData = null;

        function render(dataset) {
            grid.innerHTML = '';
            dataset.forEach((c) => {
                const el = document.createElement('div');
                el.className = `card-wrapper w-full max-w-[300px] aspect-[5/7] cursor-pointer group`;
                el.onclick = () => openModal(c);
                el.innerHTML = `
                    <div class="game-card theme-${c.suit} relative w-full h-full rounded-md overflow-hidden text-gray-200 flex flex-col">
                        <div class="z-level-img absolute inset-0 bg-black">
                            <img src="${getImg(c.file)}" alt="${c.name}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-[1.02]" onerror="this.src='https://placehold.co/300x420/222/FFF?text=${c.name}'">
                            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent to-40%"></div>
                        </div>
                        <div class="z-level-text relative p-4 pt-3 flex justify-between items-start opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                            <div class="text-shadow-sm bg-black/50 px-2 py-1 rounded backdrop-blur-sm">
                                <span class="text-xs font-bold text-white/90">${c.name}</span>
                            </div>
                        </div>
                        <div class="z-level-text mt-auto relative p-4 pb-5">
                            <div class="flex justify-between items-end mb-2">
                                <h2 class="text-2xl font-art font-bold leading-none tracking-wider text-white drop-shadow-md" style="text-shadow: 0 2px 8px rgba(0,0,0,1)">${c.name}</h2>
                                <span class="font-serif text-xl font-bold opacity-80 drop-shadow-md text-white/80">${c.rank}</span>
                            </div>
                            <div class="flex gap-2 mb-2 flex-wrap opacity-0 group-hover:opacity-100 transition-opacity duration-300 transform translate-y-2 group-hover:translate-y-0">
                                ${c.tags.map(t => `<span class="text-[9px] border border-white/30 bg-black/60 px-1.5 py-0.5 rounded text-white/90 uppercase tracking-wide backdrop-blur-sm">${t}</span>`).join('')}
                            </div>
                            <p class="text-[11px] leading-relaxed text-gray-200 font-light desc-text pl-1 drop-shadow-md line-clamp-2 bg-black/30 rounded p-1 backdrop-blur-[1px]">
                                ${c.desc}
                            </p>
                        </div>
                    </div>
                `;
                grid.appendChild(el);
                initTilt(el);
            });
        }

        function openModal(card) {
            currentCardData = card; 
            rotateContainer.classList.remove('paused'); 

            modalContent.innerHTML = `
                 <div class="absolute inset-0 bg-black">
                    <img src="${getImg(card.file)}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/360x504/222/FFF?text=${card.name}'">
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent to-50%"></div>
                </div>
                
                <button onclick="event.stopPropagation(); prepareShareImage()" class="absolute top-4 right-4 z-30 w-10 h-10 rounded-full bg-black/60 backdrop-blur-md border border-amber-500/30 text-amber-500 hover:bg-amber-900/60 hover:text-white transition-all flex items-center justify-center group/share" title="Generate Share Card">
                    <i class="fa-solid fa-share-nodes group-hover/share:scale-110 transition-transform"></i>
                </button>

                <div class="relative z-20 mt-auto p-8 pb-10 text-center">
                    <div class="mb-2">
                        <span class="text-4xl font-serif font-bold text-amber-500/80 drop-shadow-lg">${card.rank}</span>
                    </div>
                    <h2 class="text-4xl font-art font-bold text-white drop-shadow-[0_4px_4px_rgba(0,0,0,1)] mb-2">${card.name}</h2>
                    <p class="text-xs text-amber-200/80 uppercase tracking-[0.3em] mb-4">${card.title}</p>
                    <p class="text-sm text-gray-300 leading-relaxed font-light drop-shadow-md bg-black/40 p-4 rounded backdrop-blur-sm border border-white/10">
                        ${card.desc}
                    </p>
                </div>
            `;
            
            modalOverlay.classList.remove('hidden');
        }

        function closeModal() {
            modalOverlay.classList.add('hidden');
            closeShareResult();
        }

        function initTilt(wrapper) {
            const card = wrapper.querySelector('.game-card');
            wrapper.addEventListener('mousemove', (e) => {
                const rect = wrapper.getBoundingClientRect();
                const cx = rect.width / 2;
                const cy = rect.height / 2;
                const rx = ((e.clientY - rect.top - cy) / cy) * -8; 
                const ry = ((e.clientX - rect.left - cx) / cx) * 8;
                card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) scale(1.02)`;
            });
            wrapper.addEventListener('mouseleave', () => {
                card.style.transform = `rotateX(0) rotateY(0) scale(1)`;
            });
        }

        function filter(type) {
            if(type === 'all') render(cards);
            else render(cards.filter(c => c.suit === type));
        }

        // ==========================================
        //  High-Res Generation using html2canvas
        // ==========================================
        
        function prepareShareImage() {
            if(!currentCardData) return;
            rotateContainer.classList.add('paused');
            
            const card = currentCardData;
            
            // 填充隐藏模板的数据
            const shareImgBg = document.getElementById('share-img-bg');
            const shareName = document.getElementById('share-name');
            const shareTitle = document.getElementById('share-title');
            const shareDesc = document.getElementById('share-desc');
            const qrContainer = document.getElementById('qrcode-target');

            const imgPath = getImg(card.file);
            const tempImg = new Image();
            tempImg.src = imgPath;
            
            // 使用 background-image 确保 cover 效果完美
            shareImgBg.style.backgroundImage = `url('${imgPath}')`;
            
            shareName.textContent = card.name;
            shareTitle.textContent = card.title;
            shareDesc.textContent = card.desc;

            // 清空并重新生成二维码
            qrContainer.innerHTML = ""; 
            new QRCode(qrContainer, {
                text: window.location.href,
                width: 100,
                height: 100,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            // 确保图片加载后再截图
            if (tempImg.complete) {
                captureHighRes();
            } else {
                tempImg.onload = captureHighRes;
                tempImg.onerror = captureHighRes; // 失败也尝试截图
            }
        }

        function captureHighRes() {
            const element = document.getElementById('share-card-render');
            document.body.style.cursor = 'wait';

            // 关键：Scale 2.0 配合巨大的 DOM 尺寸 = 超高清
            html2canvas(element, {
                backgroundColor: null,
                scale: 2, 
                useCORS: true, 
                logging: false,
                allowTaint: true 
            }).then(canvas => {
                document.body.style.cursor = 'default';
                const imgUrl = canvas.toDataURL("image/png");
                showShareResult(imgUrl);
            }).catch(err => {
                console.error("生成失败:", err);
                document.body.style.cursor = 'default';
                alert("Image generation failed. Please try again.");
            });
        }

        function showShareResult(url) {
            const container = document.getElementById('generated-image-container');
            const overlay = document.getElementById('share-result-overlay');
            const downloadLink = document.getElementById('download-link');

            container.innerHTML = `<img src="${url}" class="h-full w-auto object-contain shadow-2xl border border-white/10 rounded-md">`;
            
            downloadLink.href = url;
            downloadLink.download = `Mythos_${currentCardData.name}.png`;

            overlay.classList.remove('hidden');
        }

        function closeShareResult() {
            const overlay = document.getElementById('share-result-overlay');
            overlay.classList.add('hidden');
            rotateContainer.classList.remove('paused');
        }

        render(cards);

    </script>
</body>
</html>
